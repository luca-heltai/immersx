name: dealiiX tutorial images

on:
  push:
    branches: [dealiix-tutorial]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealiix-tutorial-images
  cancel-in-progress: true

env:
  IMAGE_TAG: dealiix-tutorial
  CORAL_REF: dealiix-tutorial
  METRIC_FLOW_X_REF: main
  VISUALIZER_REF: dealiix-tutorial
  PLATFORM_REF: dealiix-tutorial

jobs:
  coral:
    name: Coral / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out ImmersX
        uses: actions/checkout@v4

      - name: Check out Coral
        uses: actions/checkout@v4
        with:
          repository: 2listic/coral
          ref: ${{ env.CORAL_REF }}
          path: _deps/coral
          submodules: recursive

      - name: Check out MetricFlowX
        uses: actions/checkout@v4
        with:
          repository: luca-heltai/metric-flow-x
          ref: ${{ env.METRIC_FLOW_X_REF }}
          path: _deps/metric-flow-x

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Coral + ImmersX
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coral.Dockerfile
          build-contexts: |
            coral=./_deps/coral
            metric_flow_x=./_deps/metric-flow-x
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: heltai/coral:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=coral-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=coral-${{ matrix.arch }}
          provenance: false

  visualizer:
    name: Visualizer / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out Coral Visualizer
        uses: actions/checkout@v4
        with:
          repository: 2listic/coral-visualizer
          ref: ${{ env.VISUALIZER_REF }}
          path: _deps/coral-visualizer

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Coral Visualizer
        uses: docker/build-push-action@v6
        with:
          context: _deps/coral-visualizer
          file: _deps/coral-visualizer/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: heltai/coral-visualizer:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=visualizer-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=visualizer-${{ matrix.arch }}
          provenance: false

  platform:
    name: Platform / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out ImmersX
        uses: actions/checkout@v4

      - name: Check out dealiiX-platform
        uses: actions/checkout@v4
        with:
          repository: 2listic/dealiiX-platform
          ref: ${{ env.PLATFORM_REF }}
          path: _deps/dealiiX-platform
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dealiiX-platform
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/platform.Dockerfile
          build-contexts: platform=./_deps/dealiiX-platform
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: heltai/dealiix-platform:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=platform-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=platform-${{ matrix.arch }}
          provenance: false

  manifests:
    name: Publish multi-architecture manifests
    runs-on: ubuntu-latest
    needs: [coral, visualizer, platform]
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Coral manifest
        run: |
          docker buildx imagetools create \
            --tag heltai/coral:${IMAGE_TAG} \
            --tag heltai/coral:${IMAGE_TAG}-${GITHUB_SHA} \
            heltai/coral:${IMAGE_TAG}-amd64 \
            heltai/coral:${IMAGE_TAG}-arm64

      - name: Publish Visualizer manifest
        run: |
          docker buildx imagetools create \
            --tag heltai/coral-visualizer:${IMAGE_TAG} \
            --tag heltai/coral-visualizer:${IMAGE_TAG}-${GITHUB_SHA} \
            heltai/coral-visualizer:${IMAGE_TAG}-amd64 \
            heltai/coral-visualizer:${IMAGE_TAG}-arm64

      - name: Publish platform manifest
        run: |
          docker buildx imagetools create \
            --tag heltai/dealiix-platform:${IMAGE_TAG} \
            --tag heltai/dealiix-platform:${IMAGE_TAG}-${GITHUB_SHA} \
            heltai/dealiix-platform:${IMAGE_TAG}-amd64 \
            heltai/dealiix-platform:${IMAGE_TAG}-arm64
