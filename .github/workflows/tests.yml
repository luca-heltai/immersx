name: GitHub CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Match the directory restored and saved by ccache-action.
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: dealii/dealii:v9.7.1-noble
      options: --user root --env OMPI_ALLOW_RUN_AS_ROOT=1 --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-dealii-9.7.1-noble-v2
          max-size: 1G
          append-timestamp: true
          update-package-index: true
          verbose: 1

      - uses: robinraju/release-downloader@v1
        with:
          tag: "v0.2"
          fileName: "lib1dsolver.a"

      - name: Build debug
        run: |
          ls lib1dsolver.a
          rm -rf build_linux_debug
          mkdir build_linux_debug
          cd build_linux_debug
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-fopenmp \
            -DIMMERSX_BUILD_BENCHMARKS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ninja

      - name: CTest debug
        run: |
          cd build_linux_debug
          ctest -N
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ctest --parallel 2 -L quick --output-on-failure
          else
            ctest --parallel 2 --output-on-failure
          fi

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: dealii/dealii:v9.7.1-noble
      options: --user root --env OMPI_ALLOW_RUN_AS_ROOT=1 --env OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1

    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-dealii-9.7.1-noble-v2
          max-size: 1G
          append-timestamp: true
          update-package-index: true
          verbose: 1

      - uses: robinraju/release-downloader@v1
        with:
          tag: "v0.1"
          fileName: "lib1dsolver.a"

      - name: Build release
        run: |
          ls lib1dsolver.a
          rm -rf build_linux_release
          mkdir build_linux_release
          cd build_linux_release
          cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-fopenmp \
            -DIMMERSX_BUILD_BENCHMARKS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ninja

      - name: CTest release
        run: |
          cd build_linux_release
          ctest -N
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ctest --parallel 2 -L quick --output-on-failure
          else
            ctest --parallel 2 --output-on-failure
          fi

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
