name: Indent

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: dealii/dealii:v9.7.1-noble
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Mark the repository as safe
        run: git config --global --add safe.directory /__w/immersx/immersx

      - name: Run indentation check
        run: ./scripts/check_indentation.sh
