name: Tutorial backend container

on:
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/tutorial-backend.yml'
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'scripts/tutorial-init.sh'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'coral/**'
      - 'include/**'
      - 'source/**'
      - 'apps/**'
      - 'parameters/**'
      - 'third_party/**'
  push:
    branches: [master]
    paths:
      - '.dockerignore'
      - '.github/workflows/tutorial-backend.yml'
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'scripts/tutorial-init.sh'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'coral/**'
      - 'include/**'
      - 'source/**'
      - 'apps/**'
      - 'parameters/**'
      - 'third_party/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorial-backend-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/luca-heltai/immersx-tutorial

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      TAG: sha-${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Read SDK source revisions
        id: refs
        run: |
          source docker/tutorial-sources.env
          echo "coral=$CORAL_REF" >> "$GITHUB_OUTPUT"
          echo "metric_flow_x=$METRIC_FLOW_X_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: 2listic/coral
          ref: ${{ steps.refs.outputs.coral }}
          path: _deps/coral
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: luca-heltai/metric-flow-x
          ref: ${{ steps.refs.outputs.metric_flow_x }}
          path: _deps/metric-flow-x
          persist-credentials: false
      - name: Validate the Compose configuration
        run: docker compose config --quiet
      - name: Reserve space for the deal.II SDK image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coral.Dockerfile
          build-contexts: |
            coral=./_deps/coral
            metric_flow_x=./_deps/metric-flow-x
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=tutorial-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tutorial-backend-${{ matrix.arch }}
      - name: Run the installed Coral plugins and check VTK output
        run: |
          for config in Debug Release; do
            docker run --rm --entrypoint bash -v "$PWD/coral/tests:/checks:ro" \
              -e DEAL_II_NUM_THREADS=1 "$IMAGE:$TAG" -euc '
                config=$1
                prefix="/opt/dealiix/immersx/$config"
                examples="$prefix/share/immersx/coral/examples"
                suffix=
                if [[ "$config" == Debug ]]; then suffix=_debug; fi
                cmake "-DCORAL_EXECUTABLE=/usr/local/bin/coral-${config,,}" \
                  "-DPLUGIN=$prefix/lib/immersx/coral/libcoral_backend_immersx_2$suffix.so" \
                  "-DGRAPH_SOURCE=$examples/poisson_2d.json" \
                  "-DPARAMETERS_SOURCE=$examples/poisson_2d.prm" \
                  -DEXPECTED_USED_PARAMETER_FILE=poisson_2d_used.prm \
                  -DWORKING_DIRECTORY=/tmp/poisson -P /checks/run_graph.cmake
                find /tmp/poisson/output -name "*.vtu" -size +0c | grep -q .
              ' bash "$config"
          done
      - uses: docker/login-action@v3
        if: github.repository == 'luca-heltai/immersx' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture
        if: github.repository == 'luca-heltai/immersx' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: docker push "$IMAGE:$TAG"

  publish:
    if: github.repository == 'luca-heltai/immersx' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags and verify public access
        run: |
          digest_tag="$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools create --tag "$digest_tag" --tag "$IMAGE:master" \
            "$digest_tag-amd64" "$digest_tag-arm64"
          docker buildx imagetools inspect "$digest_tag"
          DOCKER_CONFIG=$(mktemp -d) docker manifest inspect "$digest_tag" >/dev/null
