name: Tutorial backend container

on:
  pull_request:
    paths:
      - '.dockerignore'
      - '.github/workflows/tutorial-backend.yml'
      - 'Dockerfile'
      - 'docker/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'coral/**'
      - 'include/**'
      - 'source/**'
      - 'apps/**'
      - 'parameters/**'
      - 'third_party/**'
  push:
    branches: [master]
    paths:
      - '.dockerignore'
      - '.github/workflows/tutorial-backend.yml'
      - 'Dockerfile'
      - 'docker/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'coral/**'
      - 'include/**'
      - 'source/**'
      - 'apps/**'
      - 'parameters/**'
      - 'third_party/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      coral_tag:
        description: Tag of the published Coral CLI and SDK image
        default: main
        type: string
      metric_flow_x_tag:
        description: Tag of the published MetricFlowX SDK image
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: tutorial-backend-container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/luca-heltai/immersx-coral
  CORAL_TAG: ${{ inputs.coral_tag || 'main' }}
  METRIC_FLOW_X_TAG: ${{ inputs.metric_flow_x_tag || 'main' }}

jobs:
  upstream:
    runs-on: ubuntu-24.04
    outputs:
      coral: ${{ steps.images.outputs.coral }}
      metric_flow_x: ${{ steps.images.outputs.metric_flow_x }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Resolve published SDK tags for both architectures
        id: images
        run: |
          resolve() {
            local tag=$1 digest
            if ! digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}'); then
              printf 'Cannot read the upstream image tag %s from GHCR.\n' "$tag" >&2
              return 1
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || return 1
            printf '%s@%s' "$tag" "$digest"
          }
          coral=$(resolve "ghcr.io/2listic/coral:$CORAL_TAG")
          metric_flow_x=$(resolve "ghcr.io/luca-heltai/metric-flow-x:$METRIC_FLOW_X_TAG")
          echo "coral=$coral" >> "$GITHUB_OUTPUT"
          echo "metric_flow_x=$metric_flow_x" >> "$GITHUB_OUTPUT"

  build:
    needs: upstream
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      TAG: run-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Reserve space for the deal.II SDK image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coral.Dockerfile
          pull: true
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: |
            VCS_REF=${{ github.sha }}
            CORAL_IMAGE=${{ needs.upstream.outputs.coral }}
            METRIC_FLOW_X_IMAGE=${{ needs.upstream.outputs.metric_flow_x }}
          cache-from: type=gha,scope=tutorial-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tutorial-backend-${{ matrix.arch }}
      - name: Run the installed Coral plugins and check VTK output
        run: |
          for config in Debug Release; do
            docker run --rm --entrypoint bash -v "$PWD/coral/tests:/checks:ro" \
              -e DEAL_II_NUM_THREADS=1 "$IMAGE:$TAG" -euc '
                config=$1
                prefix="/opt/dealiix/immersx/$config"
                examples="$prefix/share/immersx/coral/examples"
                suffix=
                if [[ "$config" == Debug ]]; then suffix=_debug; fi
                cmake "-DCORAL_EXECUTABLE=/usr/local/bin/coral-${config,,}" \
                  "-DPLUGIN=$prefix/lib/immersx/coral/libcoral_backend_immersx_2$suffix.so" \
                  "-DGRAPH_SOURCE=$examples/poisson_2d.json" \
                  "-DPARAMETERS_SOURCE=$examples/poisson_2d.prm" \
                  -DEXPECTED_USED_PARAMETER_FILE=poisson_2d_used.prm \
                  -DWORKING_DIRECTORY=/tmp/poisson -P /checks/run_graph.cmake
                find /tmp/poisson/output -name "*.vtu" -size +0c | grep -q .
              ' bash "$config"
          done
      - name: Check SSH and Slurm in the running backend
        run: |
          backend=$(docker run -d --hostname slurm "$IMAGE:$TAG")
          trap 'docker logs "$backend"; docker rm -f "$backend" >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec "$backend" ssh -i /tutorial-ssh/id_ed25519 \
              -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=2 \
              root@localhost 'scontrol ping | grep -q UP'; then
              timeout 60 docker exec "$backend" srun --mpi=none -n 1 /bin/true
              exit
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$backend")" == false ]]; then
              exit 1
            fi
            sleep 2
          done
          exit 1
      - uses: docker/login-action@v3
        if: github.repository == 'luca-heltai/immersx' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (inputs.coral_tag || 'main') == 'main' && (inputs.metric_flow_x_tag || 'main') == 'main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture
        if: github.repository == 'luca-heltai/immersx' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (inputs.coral_tag || 'main') == 'main' && (inputs.metric_flow_x_tag || 'main') == 'main'
        run: docker push "$IMAGE:$TAG"

  publish:
    if: github.repository == 'luca-heltai/immersx' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (inputs.coral_tag || 'main') == 'main' && (inputs.metric_flow_x_tag || 'main') == 'main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags and verify public access
        run: |
          run_tag="$IMAGE:run-$GITHUB_RUN_ID"
          docker buildx imagetools create --tag "$IMAGE:main" \
            "$run_tag-amd64" "$run_tag-arm64"
          docker buildx imagetools inspect "$IMAGE:main"
          DOCKER_CONFIG=$(mktemp -d) docker manifest inspect "$IMAGE:main" >/dev/null
